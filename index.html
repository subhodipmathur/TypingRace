<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Typing Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby">
        <h1>🏎️ Fast Typing Race</h1>
        <input type="text" id="player-name" placeholder="Enter your name">
        <label for="word-count">Words per race:</label>
        <select id="word-count">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="custom">Custom</option>
        </select>
        <br><br>
        <button id="create-room">Create Room</button>
        <input type="text" id="room-code" placeholder="Room Code to Join">
        <button id="join-room">Join Room</button>
        <p id="room-display"></p>
        <button id="start-game-btn" style="display:none">Start Game (Host)</button>
    </div>

    <div id="game" style="display:none">
        <div class="game-header">
            <div id="room-corner"></div>
            <div id="wpm-display">WPM: 0</div>
            <button id="leave-race-btn">Leave Race</button>
        </div>
        
        <div id="countdown"></div>
        
        <div class="track-container">
            <canvas id="particle-canvas"></canvas>
            <div id="finish-line"></div>
        </div>
        <div id="finish-banner" style="display:none;">FINISH!</div>
        <p id="current-word"></p>
        <input type="text" id="input" placeholder="Type here..." autocomplete="off">
        
        <div id="scoreboard"></div>
    </div>

    <div id="notification-container"></div>

    <div id="end-race-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title">RACE RESULTS</h2>
            <div id="final-leaderboard" class="leaderboard-list">
            </div>
            <div class="modal-actions">
                <button id="restart-race-btn" class="btn btn-primary">RESTART RACE</button>
                <button id="return-lobby-btn" class="btn btn-secondary">BACK TO LOBBY</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
